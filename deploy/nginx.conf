# nginx in front of the Guest Score SPA.
#
# It also proxies /api and /graphql to the API service, which is what keeps the
# browser on a single origin. That is not cosmetic: same-origin means no CORS
# preflight on every mutation, and it means the SPA can be built once with
# relative URLs instead of baking an API hostname into the bundle at build time.

upstream guest_score_api {
    # The Compose service name and the Kubernetes Service name are the same by
    # design (see the platform contract), so this one literal is correct in both.
    # It is not templated: nginx does no environment substitution in a plain
    # conf file, and a ${VAR} left here would be sent to the resolver verbatim
    # and fail at request time rather than at start.
    server guest-score-api:8090;
}

server {
    # 5174 to match the platform contract's published port for this service, so
    # the container port, the compose mapping and the Kubernetes Service all
    # agree on one number.
    listen 5174;
    server_name _;

    # The SPA bundle can be large and compresses to roughly a fifth.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A reverse proxy should not advertise its version.
    server_tokens off;

    # Clickjacking and MIME-sniffing defences. A front-desk console showing a
    # guest's standing is a plausible target for an overlay attack.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://guest_score_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A reindex is synchronous over the whole directory, so the default 60s
        # read timeout is not enough.
        proxy_read_timeout 180s;
    }

    location /graphql {
        proxy_pass http://guest_score_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /graphiql {
        proxy_pass http://guest_score_api;
        proxy_set_header Host $host;
    }

    # Hashed build assets are content-addressed and safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else falls through to the SPA shell so client-side routes
    # survive a hard refresh. index.html itself must never be cached, or users
    # get a stale shell pointing at deleted bundles.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
